services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata1:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - edge-net
  nats:
    image: nats:2.10
    ports: ["4222:4222"]
    networks:
      - edge-net

  # migrate:
  #   image: arigaio/atlas:latest
  #   volumes:
  #     - ./ent/migrate:/migrations
  #     - ./scripts:/scripts
  #   entrypoint: ["/bin/sh", "-c", "/scripts/migrate.sh"]
  #   # entrypoint: ["/scripts/migrate.sh"]
  #   depends_on:
  #     - postgres

  co:
    build:
      dockerfile: ./dockerfile.co

    # image: bbalu/ieo-co:latest
    # command: ["--config=/config/prod.yaml"]
    # volumes:
      # - ./configs/co:/config
    depends_on: [postgres]
    ports: ["9001:9001"]
    expose:
      - "9200"
    environment:
      APP_ENV: prod
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:5432/${PG_DB}?sslmode=disable
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CO_PORT: 9001
      CO_METRICS_PORT: 9200
    networks:
      - edge-net
  lo:
    build:
      dockerfile: ./dockerfile.lo    
    depends_on: [nats]
    ports: ["9010:9010"]
    expose:
      - "9200"
    environment:
      APP_ENV: prod
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      BOLT_DIR: 
      LO_PORT: 9010
      LO_METRICS_PORT: 9200
      LO_NATS_URL: nats://nats:4222
      LO_CO_URL: http://co:9001
    volumes:
      - ./local-cache:/tmp/repo-cache
    networks:
      - edge-net
    dns:
      - 8.8.8.8
      - 1.1.1.1


  en:
    build:
      dockerfile: ./dockerfile.en    
    depends_on: [nats]
    ports: ["9011:9011"]
    expose:
      - "9200"
    environment:
      APP_ENV: prod
      IEO_EN_PORT: 9011
      IEO_EN_METRICS_PORT: 9200
      IEO_EN_NATS_URL: nats://nats:4222
      IEO_EN_LO_URL: http://lo:9010
    networks:
      - edge-net

networks:
  edge-net:
    driver: bridge

volumes:
  pgdata1:
