name: Release edgectl + quickstart bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build edgectl (linux amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o dist/edgectl ./cmd/edgectl

      - name: Prepare release bundle
        run: |
          mkdir -p bundle/ieo-quickstart/db

          cp dist/edgectl bundle/ieo-quickstart/
          cp deploy/docker-compose.yaml bundle/ieo-quickstart/
          cp deploy/.env.example bundle/ieo-quickstart/
          cp deploy/db/init.sql bundle/ieo-quickstart/db/
          cp README.md bundle/ieo-quickstart/

      - name: Create tar.gz
        run: |
          tar -czf ieo-quickstart-linux-amd64.tar.gz \
              -C bundle ieo-quickstart

      - name: Create zip
        run: |
          cd bundle && zip -r ../ieo-quickstart-linux-amd64.zip ieo-quickstart

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ieo-quickstart-linux-amd64.tar.gz
            ieo-quickstart-linux-amd64.zip
