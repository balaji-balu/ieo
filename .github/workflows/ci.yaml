# PR gate for docs/process.md stage 6 (Verify). Mirrors the local commands in CLAUDE.md.
#
# Ratchet: legacy code is not yet clean, so
#  - build and test skip the broken packages listed in scripts/go-packages.sh;
#  - lint and format checks apply only to lines a change adds or modifies.
# Both tighten as the baseline is fixed. Never loosen them to get green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are superseded. Each main run lints just its own commit, so
  # cancelling one would leave that merge unchecked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    # The CO store tests run against Postgres too (internal/co/store/storetest).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ieo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      IEO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ieo_test?sslmode=disable
      IEO_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build $(scripts/go-packages.sh)

      # go vet runs in the lint job (govet, new issues only); legacy vet
      # findings would otherwise fail every test run.
      - name: Test
        run: go test -race -vet=off -count=1 $(scripts/go-packages.sh test)

      # Report only until v0.1.0 (docs/roadmap.md), when it gains -strict.
      - name: Conformance gap list (§17, ADR 0011)
        run: |
          go run ./tools/conformance | tee conformance.txt
          { echo '## Conformance'; echo; echo '```'; cat conformance.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (new issues)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      # PRs: everything the branch adds since it left the base.
      # main: the merged commit against its first parent (the previous main),
      # which exists even after a force-push or on a first push.
      #
      # The changed lines are passed as a patch that ignores a carriage return
      # at the end of a line, so a commit that only renormalizes line endings
      # (.gitattributes) doesn't make every legacy finding in the file "new".
      # A CR there never carries meaning in Go source, so no finding is hidden.
      - name: Choose baseline revision
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            base=$(git rev-parse HEAD^1)
          fi
          git diff --ignore-cr-at-eol "$base" > "$RUNNER_TEMP/new.patch"
          echo "flag=--new-from-patch=$RUNNER_TEMP/new.patch" >> "$GITHUB_OUTPUT"

      - name: golangci-lint (includes gofmt, goimports, govet)
        run: golangci-lint run ${{ steps.base.outputs.flag }} $(scripts/go-packages.sh test)

      - name: golangci-lint, packages with broken tests (production code only)
        run: golangci-lint run --tests=false ${{ steps.base.outputs.flag }} $(scripts/go-packages.sh no-test)

  # The laptop harness (ADR 0009, roadmap 0.5) must come up on a clean machine. §17.8 tests will run
  # against this same stack.
  harness:
    name: Dev harness
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f deploy/dev/compose.yaml
      SITE_ID: 00000000-0000-4000-8000-000000000001 # LO_SITE_ID in compose.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5 # tools/harnessdeploy
        with:
          go-version-file: go.mod

      # The Compose bundle is not started here; that it still parses with its keys is checked.
      - name: The Compose bundle is valid
        run: |
          SITE_NATS_PASSWORD=abc SITE_ID=site-1 LO_SITE_TOKEN=t EN_OTEL_HTTP_ENDPOINT=http://otel.test:4318 \
            PG_USER=u PG_PASSWORD=p PG_DB=d PG_HOST=postgres GITHUB_TOKEN= \
            docker compose -f deploy/compose/docker-compose.yaml config -q

      # SPEC §15.6: the site's NATS password, new for each run. Compose needs it for every command.
      - name: Make the site's NATS password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "SITE_NATS_PASSWORD=$password" >> "$GITHUB_ENV"

      # The LO needs its site's token, which only the CO issues (docs/dev-setup.md).
      - name: Start the CO
        run: $COMPOSE up -d --build --wait --wait-timeout 300 co

      - name: Add the site
        run: |
          token=$($COMPOSE exec -T co app site add "$SITE_ID")
          test -n "$token"
          echo "::add-mask::$token"
          echo "LO_SITE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300

      - name: Every service is running
        run: |
          want="co en1 en2 host1 host2 lo nats postgres registry"
          got=$($COMPOSE ps --status running --services | sort | xargs)
          echo "running: $got"
          test "$got" = "$want"

      - name: Each EN reaches its own engine, and the engines differ
        run: |
          id1=$($COMPOSE exec -T en1 wget -qO- http://127.0.0.1:2375/info | grep -o '"ID":"[^"]*"')
          id2=$($COMPOSE exec -T en2 wget -qO- http://127.0.0.1:2375/info | grep -o '"ID":"[^"]*"')
          echo "en1 → $id1"; echo "en2 → $id2"
          test -n "$id1" && test -n "$id2" && test "$id1" != "$id2"

      - name: An EN cannot reach another host's engine
        run: |
          if $COMPOSE exec -T en2 wget -qO- -T 5 http://host1:2375/version; then
            echo "en2 reached host1's engine"; exit 1
          fi

      - name: The LO accepted the site's manifest
        run: |
          for i in $(seq 30); do
            if $COMPOSE logs --no-color lo | grep '"outcome":"Accepted"'; then exit 0; fi
            sleep 2
          done
          echo "no Accepted sync attempt"; $COMPOSE logs --no-color lo | tail -20; exit 1

      # SPEC §11.2, §13.1: each EN connects as its own host, and says so in a JSON line with
      # site_id and host_id.
      - name: Each EN connects to the site NATS server as its host
        run: |
          for n in 1 2; do
            for i in $(seq 30); do
              if $COMPOSE logs --no-color "en$n" | grep '"msg":"connected to the site NATS server"' | grep -qF "\"host_id\":\"host-$n\""; then
                continue 2
              fi
              sleep 2
            done
            echo "en$n did not connect as host-$n"; $COMPOSE logs --no-color "en$n" | tail -20; exit 1
          done

      # SPEC §15.6: the server takes only the site's login. A CONNECT without it is refused.
      - name: The site NATS server refuses a client without the password
        run: |
          answer=$($COMPOSE exec -T en1 sh -c 'printf "CONNECT {\"verbose\":true}\r\nPING\r\n" | nc -w 3 nats 4222' || true)
          echo "$answer"
          echo "$answer" | grep -q "Authorization Violation"

      # ADR 0016: the host ID is kept in the EN's data volume, so a restart keeps it.
      - name: A restarted EN keeps its host ID
        run: |
          $COMPOSE restart en1
          for i in $(seq 30); do
            n=$($COMPOSE logs --no-color en1 | grep -c '"msg":"connected to the site NATS server"' || true)
            if [ "$n" -ge 2 ]; then break; fi
            sleep 2
          done
          $COMPOSE logs --no-color en1 | tail -5
          test "$n" -ge 2 || { echo "en1 did not connect again after its restart"; exit 1; }
          if $COMPOSE logs --no-color en1 | grep '"msg":"connected to the site NATS server"' | grep -vqF '"host_id":"host-1"'; then
            echo "en1 connected with another host ID"; exit 1
          fi
          test "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$($COMPOSE ps -q en1)")" = "true 0"

      # Roadmap D5.7: a deployment to host-1 runs on host1's engine, and only there.
      - name: Deploy the test application to host-1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orchestration?sslmode=disable
        run: |
          go run ./tools/harnessdeploy > "$RUNNER_TEMP/deployment.env"
          cat "$RUNNER_TEMP/deployment.env"
          cat "$RUNNER_TEMP/deployment.env" >> "$GITHUB_ENV"

      # SPEC §8.5, §8.9, §16.6: the LO sends the Apply to en1, which brings the project up on host1.
      - name: The deployment's Compose project runs on host1
        run: |
          for i in $(seq 90); do
            id=$($COMPOSE exec -T host1 docker ps -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT")
            if [ -n "$id" ]; then break; fi
            sleep 2
          done
          $COMPOSE exec -T host1 docker ps
          test -n "$id" || { echo "no container of $COMPOSE_PROJECT on host1"; $COMPOSE logs --no-color lo en1 | tail -40; exit 1; }
          test "$(echo "$id" | wc -l)" -eq 1
          echo "CONTAINER_ID=$id" >> "$GITHUB_ENV"

      - name: host2 runs no project
        run: |
          got=$($COMPOSE exec -T host2 docker ps -aq --filter label=com.docker.compose.project)
          test -z "$got" || { $COMPOSE exec -T host2 docker ps -a; exit 1; }

      # SPEC §13.1: the line carries the deployment and its host.
      - name: en1 logs the component installed
        run: |
          $COMPOSE logs --no-color en1 | grep '"msg":"component installed"' | grep -F "\"deployment_id\":\"$DEPLOYMENT_ID\"" | grep -qF '"host_id":"host-1"'

      - name: The token appears in no log (SPEC §15.4)
        run: |
          if $COMPOSE logs --no-color | grep -qF "$LO_SITE_TOKEN"; then
            echo "a log contains the site token"; exit 1
          fi

      - name: The NATS password appears in no log (SPEC §15.4)
        run: |
          if $COMPOSE logs --no-color | grep -qF "$SITE_NATS_PASSWORD"; then
            echo "a log contains the NATS password"; exit 1
          fi

      # SPEC §17.6 idempotency, end to end: after a restart en1 sends its Inventory on connect, the
      # LO finds the deployment installed, and the container is left as it is.
      - name: A restarted EN leaves the deployment's container running
        run: |
          $COMPOSE restart en1
          for i in $(seq 30); do
            n=$($COMPOSE logs --no-color en1 | grep -c '"msg":"connected to the site NATS server"' || true)
            if [ "$n" -ge 3 ]; then break; fi
            sleep 2
          done
          test "$n" -ge 3 || { echo "en1 did not connect again after its restart"; exit 1; }
          sleep 15 # several LO polls and the reconcile of en1's Inventory
          id=$($COMPOSE exec -T host1 docker ps -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT")
          echo "container before: $CONTAINER_ID, after: $id"
          test "$id" = "$CONTAINER_ID"
          test "$($COMPOSE logs --no-color en1 | grep -c '"msg":"component installed"')" -eq 1

      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop
        if: always()
        run: $COMPOSE down -v
