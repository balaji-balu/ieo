# PR gate for docs/process.md stage 6 (Verify). Mirrors the local commands in CLAUDE.md.
#
# Ratchet: legacy code is not yet clean, so
#  - build and test skip the packages listed in scripts/go-packages.sh (KNOWN_BROKEN);
#  - lint and format checks apply only to lines a change adds or modifies.
# Both tighten as the baseline is fixed. Never loosen them to get green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build $(scripts/go-packages.sh)

      # go vet runs in the lint job (govet, new issues only); legacy vet
      # findings would otherwise fail every test run.
      - name: Test
        run: go test -race -vet=off -count=1 $(scripts/go-packages.sh)

  lint:
    name: Lint (new issues)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Choose baseline revision
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "flag=--new-from-merge-base=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--new-from-rev=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: golangci-lint (includes gofmt, goimports, govet)
        run: golangci-lint run ${{ steps.base.outputs.flag }} $(scripts/go-packages.sh)
