# Laptop harness (ADR 0009): 1 CO, 1 LO and 2 simulated hosts, plus NATS, Postgres and an OCI
# registry. Works the same from PowerShell and bash, on Docker Desktop (WSL 2) and in CI. The LO
# needs its site's token, which only the CO issues, so the stack starts in two steps
# (docs/dev-setup.md):
#
#   docker compose -f deploy/dev/compose.yaml up -d --build --wait co
#   docker compose -f deploy/dev/compose.yaml exec -T co app site add 00000000-0000-4000-8000-000000000001
#     then put the printed token in deploy/dev/.env as LO_SITE_TOKEN=<token> (gitignored)
#   docker compose -f deploy/dev/compose.yaml up -d --build --wait
#   docker compose -f deploy/dev/compose.yaml down -v
#
# CO, LO and EN are built from this checkout (deploy/dev/Dockerfile). The LO syncs with the CO's
# Margo API and connects to NATS as the site's user (SPEC §15.6). Each EN connects to NATS as its
# host, takes the LO's commands and runs them with the Compose CLI on its host's engine. Until
# roadmap slices D5.6c–E replace it, the old, Git-based code runs beside them: the CO and LO clone
# public GitHub repos at startup and log an error if that fails.
#
# Each simulated host is two containers that act as one machine: hostN runs its own Docker engine
# (docker:dind) and enN shares its network namespace, so enN reaches that engine, and only that
# engine, at tcp://127.0.0.1:2375. When slice D has the EN write Compose files, it adds a volume
# shared by both at the same path.
# See docs/dev-setup.md.

name: ieo-dev

x-ieo-build: &ieo-build
  context: ../..
  dockerfile: deploy/dev/Dockerfile

x-host: &host
  image: docker:27-dind
  privileged: true # dind needs it
  environment:
    DOCKER_TLS_CERTDIR: "" # no TLS: the TCP listener is on the host's own loopback only
  # Starts with "dockerd" so the dind entrypoint adds no defaults of its own (they would also listen
  # on 0.0.0.0:2375, open to every container on the network).
  command:
    - dockerd
    - --host=unix:///var/run/docker.sock
    - --host=tcp://127.0.0.1:2375
    - --tls=false
    - --insecure-registry=registry:5000
  healthcheck:
    test: ["CMD", "docker", "version"]
    interval: 5s
    timeout: 5s
    retries: 30
  restart: unless-stopped

x-en-env: &en-env
  EN_SITE_ID: 00000000-0000-4000-8000-000000000001 # LO_SITE_ID
  EN_DATA_DIR: /var/lib/ieo/en # a volume: the host ID and the EN store survive a restart (SPEC §9.1)
  EN_NATS_URL: nats://nats:4222
  EN_NATS_INSECURE: "true" # no TLS on the compose network; the EN logs a warning (SPEC §15.6)
  # The site's NATS login, as the LO's below: values for this harness only, until roadmap D5.6c
  # takes the password from deploy/dev/.env.
  EN_NATS_USERNAME: site
  EN_NATS_PASSWORD: dev-harness-only
  # Required (SPEC §6.3); nothing listens there until roadmap slice M adds the collector.
  EN_OTEL_HTTP_ENDPOINT: http://otel-collector.invalid:4318
  EN_REGISTRY_INSECURE: "true" # registry:5000 is plain HTTP; the EN logs a warning (ADR 0021)
  DOCKER_HOST: tcp://127.0.0.1:2375 # this host's engine, which the Compose CLI uses

x-en: &en
  build:
    <<: *ieo-build
    args: { CMD: en, BASE: "docker:27-cli" } # the EN runs the Compose CLI (ADR 0003)
  restart: unless-stopped

services:
  # LO ↔ EN messaging. 8222 is the monitoring endpoint. The server asks for no login until the old
  # EN, which has none, is replaced (roadmap D5.6); it ignores the one the LO sends.
  nats:
    image: nats:2.10-alpine
    command: ["--http_port", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # CO database. The schema is created from deploy/compose/db/init.sql on the first start with an
  # empty volume (deploy/README.md). Same credentials as atlas.hcl's local env.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestration
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../compose/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "orchestration"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Application Registry. Push from the laptop to localhost:5000; hosts pull from registry:5000.
  registry:
    image: registry:2
    ports: ["5000:5000"]
    volumes:
      - registry:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Central Orchestrator: Margo API (and /healthz) on 9002; the old API on 9001 until roadmap slice E.
  co:
    build:
      <<: *ieo-build
      args: { CMD: co }
    environment:
      APP_ENV: prod
      CO_MARGO_ADDR: ":9002"
      CO_PORT: "9001"
      CO_METRICS_PORT: "9200"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orchestration?sslmode=disable
    ports: ["9001:9001", "9002:9002"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # Both APIs: the old LO still registers on 9001, once, at startup (until roadmap slice E).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && wget -qO- http://127.0.0.1:9001/api/v1/sites"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Local Orchestrator for the one site. It polls the CO's Margo API with the site's token, keeps
  # its store in /var/lib/lo/lo.db, and reconciles the hosts over NATS. The old LO (LO_PORT set)
  # registers with the old CO API once at startup, which needs a UUID site ID until roadmap slice E.
  lo:
    build:
      <<: *ieo-build
      args: { CMD: lo }
    environment:
      APP_ENV: prod
      LO_SITE_ID: 00000000-0000-4000-8000-000000000001
      LO_CO_URL: http://co:9002
      LO_CO_INSECURE: "true" # plain HTTP on the compose network; the LO logs a warning (SPEC §15.6)
      LO_DATA_DIR: /var/lib/lo
      # From deploy/dev/.env or the shell. Empty until the site is added: the LO then exits with a
      # configuration error.
      LO_SITE_TOKEN: ${LO_SITE_TOKEN:-}
      LO_PORT: "9010"
      LO_METRICS_PORT: "9200"
      LO_NATS_URL: nats://nats:4222 # also read by the old LO
      LO_NATS_INSECURE: "true" # no TLS on the compose network; the LO logs a warning (SPEC §15.6)
      # The site's NATS login (SPEC §15.6). Values for this harness only, like the Postgres ones
      # above: the server checks no login until roadmap D5.6. When it does, the password must
      # come from deploy/dev/.env, as LO_SITE_TOKEN does, not from this file.
      LO_NATS_USERNAME: site
      LO_NATS_PASSWORD: dev-harness-only
      LO_LEGACY_CO_URL: http://co:9001
    ports: ["9010:9010"]
    volumes:
      - lo-data:/var/lib/lo
    depends_on:
      nats: { condition: service_healthy }
      co: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9010/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Simulated host 1: its engine, and its EN.
  host1:
    <<: *host
    volumes:
      - host1-engine:/var/lib/docker
  en1:
    <<: *en
    environment:
      <<: *en-env
      EN_HOST_ID: host-1 # a deployment's target is 00000000-0000-4000-8000-000000000001/host-1
    volumes:
      - en1-data:/var/lib/ieo/en
    network_mode: service:host1
    depends_on:
      host1: { condition: service_healthy }
      lo: { condition: service_healthy }

  # Simulated host 2.
  host2:
    <<: *host
    volumes:
      - host2-engine:/var/lib/docker
  en2:
    <<: *en
    environment:
      <<: *en-env
      EN_HOST_ID: host-2
    volumes:
      - en2-data:/var/lib/ieo/en
    network_mode: service:host2
    depends_on:
      host2: { condition: service_healthy }
      lo: { condition: service_healthy }

volumes:
  pgdata:
  registry:
  lo-data:
  host1-engine:
  host2-engine:
  en1-data:
  en2-data:
