# Laptop harness (ADR 0009): 1 CO, 1 LO and 2 simulated hosts, plus NATS, Postgres and an OCI
# registry. Works the same from PowerShell and bash, on Docker Desktop (WSL 2) and in CI. Every
# command needs SITE_NATS_PASSWORD, the site's NATS password, in deploy/dev/.env (gitignored). The
# LO needs its site's token, which only the CO issues, so the stack starts in two steps
# (docs/dev-setup.md):
#
#   put SITE_NATS_PASSWORD=<a random value> in deploy/dev/.env
#   docker compose -f deploy/dev/compose.yaml up -d --build --wait co
#   docker compose -f deploy/dev/compose.yaml exec -T co app site add 00000000-0000-4000-8000-000000000001
#     then add the printed token to deploy/dev/.env as LO_SITE_TOKEN=<token>
#   docker compose -f deploy/dev/compose.yaml up -d --build --wait
#   docker compose -f deploy/dev/compose.yaml down -v
#
# CO, LO and EN are built from this checkout (deploy/dev/Dockerfile). The LO syncs with the CO's
# Margo API and connects to NATS as the site's user (SPEC §15.6). Each EN connects to NATS as its
# host, takes the LO's commands and runs them with the Compose CLI on its host's engine. Until
# roadmap slice E replaces it, the old, Git-based CO runs beside the new one: it clones public
# GitHub repos at startup and logs an error if that fails.
#
# Each simulated host is two containers that act as one machine: hostN runs its own Docker engine
# (docker:dind) and enN shares its network namespace, so enN reaches that engine, and only that
# engine, at tcp://127.0.0.1:2375. The EN's data volume is mounted into both at the same path,
# /var/lib/ieo/en: the EN writes each component's files there, and the Compose CLI sends their
# paths to the engine, which then finds them.
#
# tools/harnessdeploy deploys a test application to host-1 (roadmap D5.7):
#
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/orchestration?sslmode=disable go run ./tools/harnessdeploy
#
# See docs/dev-setup.md.

name: ieo-dev

x-ieo-build: &ieo-build
  context: ../..
  dockerfile: deploy/dev/Dockerfile

x-host: &host
  image: docker:27-dind
  privileged: true # dind needs it
  environment:
    DOCKER_TLS_CERTDIR: "" # no TLS: the TCP listener is on the host's own loopback only
  # Starts with "dockerd" so the dind entrypoint adds no defaults of its own (they would also listen
  # on 0.0.0.0:2375, open to every container on the network).
  command:
    - dockerd
    - --host=unix:///var/run/docker.sock
    - --host=tcp://127.0.0.1:2375
    - --tls=false
    - --insecure-registry=registry:5000
  healthcheck:
    test: ["CMD", "docker", "version"]
    interval: 5s
    timeout: 5s
    retries: 30
  restart: unless-stopped

x-en-env: &en-env
  EN_SITE_ID: 00000000-0000-4000-8000-000000000001 # LO_SITE_ID
  EN_DATA_DIR: /var/lib/ieo/en # a volume: the host ID and the EN store survive a restart (SPEC §9.1)
  EN_NATS_URL: nats://nats:4222
  EN_NATS_INSECURE: "true" # no TLS on the compose network; the EN logs a warning (SPEC §15.6)
  # The site's NATS login, as the LO's below (SPEC §15.6).
  EN_NATS_USERNAME: site
  EN_NATS_PASSWORD: ${SITE_NATS_PASSWORD:?set SITE_NATS_PASSWORD in deploy/dev/.env (docs/dev-setup.md)}
  # Required (SPEC §6.3); nothing listens there until roadmap slice M adds the collector.
  EN_OTEL_HTTP_ENDPOINT: http://otel-collector.invalid:4318
  EN_REGISTRY_INSECURE: "true" # registry:5000 is plain HTTP; the EN logs a warning (ADR 0021)
  DOCKER_HOST: tcp://127.0.0.1:2375 # this host's engine, which the Compose CLI uses

x-en: &en
  build:
    <<: *ieo-build
    args: { CMD: en, BASE: "docker:27-cli" } # the EN runs the Compose CLI (ADR 0003)
  restart: unless-stopped

services:
  # LO ↔ EN messaging, with the site's one login until scoped credentials (SPEC §15.6). 8222 is
  # the monitoring endpoint, which asks for none and takes no client.
  nats:
    image: nats:2.10-alpine
    # The server reads the password from a config file written at start, quoted, from this
    # environment: so it is in no process listing, and a value such as 3e5... is not read as a
    # number, as nats-server reads an unquoted $VARIABLE. Letters and digits only.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$SITE_NATS_PASSWORD" in *[!A-Za-z0-9]*) echo "SITE_NATS_PASSWORD holds letters and digits only" >&2; exit 2;; esac
        umask 077
        printf 'port: 4222\nhttp_port: 8222\nauthorization { user: site, password: "%s" }\n' "$$SITE_NATS_PASSWORD" > /tmp/site.conf
        exec nats-server -c /tmp/site.conf
    environment:
      SITE_NATS_PASSWORD: ${SITE_NATS_PASSWORD:?set SITE_NATS_PASSWORD in deploy/dev/.env (docs/dev-setup.md)}
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # CO database. The schema is created from deploy/compose/db/init.sql on the first start with an
  # empty volume (deploy/README.md). Same credentials as atlas.hcl's local env.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestration
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../compose/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "orchestration"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Application Registry. Push from the laptop to localhost:5000; hosts pull from registry:5000.
  registry:
    image: registry:2
    ports: ["5000:5000"]
    volumes:
      - registry:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Central Orchestrator: Margo API (and /healthz) on 9002; the old API on 9001 until roadmap slice E.
  co:
    build:
      <<: *ieo-build
      args: { CMD: co }
    environment:
      APP_ENV: prod
      CO_MARGO_ADDR: ":9002"
      CO_PORT: "9001"
      CO_METRICS_PORT: "9200"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orchestration?sslmode=disable
    ports: ["9001:9001", "9002:9002"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # Both APIs: the old one on 9001 runs until roadmap slice E.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && wget -qO- http://127.0.0.1:9001/api/v1/sites"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Local Orchestrator for the one site. It polls the CO's Margo API with the site's token, keeps
  # its store in /var/lib/lo/lo.db, and reconciles the hosts over NATS. It has no health endpoint:
  # the ENs wait only for it to start, and CI checks its log for an accepted manifest.
  lo:
    build:
      <<: *ieo-build
      args: { CMD: lo }
    environment:
      APP_ENV: prod
      LO_SITE_ID: 00000000-0000-4000-8000-000000000001
      LO_CO_URL: http://co:9002
      LO_CO_INSECURE: "true" # plain HTTP on the compose network; the LO logs a warning (SPEC §15.6)
      LO_DATA_DIR: /var/lib/lo
      LO_POLL_INTERVAL: 5s # a new deployment reaches the hosts within seconds, not a minute
      # From deploy/dev/.env or the shell. Empty until the site is added: the LO then exits with a
      # configuration error.
      LO_SITE_TOKEN: ${LO_SITE_TOKEN:-}
      LO_NATS_URL: nats://nats:4222
      LO_NATS_INSECURE: "true" # no TLS on the compose network; the LO logs a warning (SPEC §15.6)
      # The site's NATS login (SPEC §15.6), from deploy/dev/.env as the server's is.
      LO_NATS_USERNAME: site
      LO_NATS_PASSWORD: ${SITE_NATS_PASSWORD:?set SITE_NATS_PASSWORD in deploy/dev/.env (docs/dev-setup.md)}
    volumes:
      - lo-data:/var/lib/lo
    depends_on:
      nats: { condition: service_healthy }
      co: { condition: service_healthy }
    restart: unless-stopped

  # Simulated host 1: its engine, and its EN.
  host1:
    <<: *host
    volumes:
      - host1-engine:/var/lib/docker
      - en1-data:/var/lib/ieo/en # the EN's files, at the path the EN gives the engine
  en1:
    <<: *en
    environment:
      <<: *en-env
      EN_HOST_ID: host-1 # a deployment's target is 00000000-0000-4000-8000-000000000001/host-1
    volumes:
      - en1-data:/var/lib/ieo/en
    network_mode: service:host1
    depends_on:
      host1: { condition: service_healthy }
      lo: { condition: service_started } # the LO has no healthcheck

  # Simulated host 2.
  host2:
    <<: *host
    volumes:
      - host2-engine:/var/lib/docker
      - en2-data:/var/lib/ieo/en # the EN's files, at the path the EN gives the engine
  en2:
    <<: *en
    environment:
      <<: *en-env
      EN_HOST_ID: host-2
    volumes:
      - en2-data:/var/lib/ieo/en
    network_mode: service:host2
    depends_on:
      host2: { condition: service_healthy }
      lo: { condition: service_started } # the LO has no healthcheck

volumes:
  pgdata:
  registry:
  lo-data:
  host1-engine:
  host2-engine:
  en1-data:
  en2-data:
