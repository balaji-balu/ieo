services:  
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - edge-net
  # The site NATS server, with the site's one login until scoped credentials (SPEC §15.6).
  # 4222 is published for ENs on other machines; this bundle's LO and EN use edge-net.
  nats:
    image: nats:2.10-alpine # it has the shell the start below needs
    # The server reads the password from a config file written at start, quoted, from this
    # environment: so it is in no process listing, and a value such as 3e5... is not read as a
    # number, as nats-server reads an unquoted $VARIABLE. Letters and digits only.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$SITE_NATS_PASSWORD" in *[!A-Za-z0-9]*) echo "SITE_NATS_PASSWORD holds letters and digits only" >&2; exit 2;; esac
        umask 077
        printf 'port: 4222\nauthorization { user: site, password: "%s" }\n' "$$SITE_NATS_PASSWORD" > /tmp/site.conf
        exec nats-server -c /tmp/site.conf
    environment:
      SITE_NATS_PASSWORD: ${SITE_NATS_PASSWORD:?set SITE_NATS_PASSWORD in .env}
    ports: ["4222:4222"]
    networks:
      - edge-net

  # The CO (keys: deploy/README.md, "CO configuration"). The LO uses its Margo API on 9002;
  # edgectl uses its operator API on 8443 (SPEC §11.3). It creates its tables at startup (ADR 0013).
  co:
    image: ghcr.io/balaji-balu/ieo-co:latest
    # The CO opens and migrates its store at startup, so it waits for Postgres to answer.
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    ports: ["9002:9002", "8443:8443"]
    environment:
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:5432/${PG_DB}?sslmode=disable
      CO_MARGO_ADDR: ":9002"
      CO_OPERATOR_ADDR: ":8443"
      CO_OPERATOR_TOKEN: ${CO_OPERATOR_TOKEN:?set CO_OPERATOR_TOKEN in .env, at least 32 bytes}
    networks:
      - edge-net

  # The LO of the site SITE_ID (keys: deploy/README.md, "LO configuration"). Its token comes from
  # `docker compose exec co ./ieo-co site add <SITE_ID>`.
  lo:
    image: ghcr.io/balaji-balu/ieo-lo:latest
    depends_on: [nats, co]
    environment:
      LO_SITE_ID: ${SITE_ID:?set SITE_ID in .env}
      LO_CO_URL: http://co:9002
      LO_CO_INSECURE: "true" # plain HTTP on this compose network; the LO logs a warning (SPEC §15.6)
      LO_SITE_TOKEN: ${LO_SITE_TOKEN:?set LO_SITE_TOKEN in .env, from co site add}
      LO_DATA_DIR: /var/lib/lo
      LO_NATS_URL: nats://nats:4222
      LO_NATS_INSECURE: "true" # no TLS on this compose network; the LO logs a warning (SPEC §15.6)
      LO_NATS_USERNAME: site
      LO_NATS_PASSWORD: ${SITE_NATS_PASSWORD:?set SITE_NATS_PASSWORD in .env}
    volumes:
      - lo-data:/var/lib/lo
    networks:
      - edge-net

  # One EN, on the machine that runs this file (keys: deploy/README.md, "EN configuration"). It
  # runs deployments with the Compose CLI on this machine's engine, through its socket: whoever
  # controls the EN controls the engine (ADR 0003). Its data directory is the same path on the
  # machine and in the container, so the paths in a deployment's compose.yaml, which the engine
  # resolves on the machine, find the files the EN extracted.
  en:
    image: ghcr.io/balaji-balu/ieo-en:latest
    depends_on: [nats]
    environment:
      EN_SITE_ID: ${SITE_ID:?set SITE_ID in .env}
      EN_HOST_ID: ${EN_HOST_ID:-host-1}
      EN_DATA_DIR: /var/lib/ieo/en
      EN_NATS_URL: nats://nats:4222
      EN_NATS_INSECURE: "true" # no TLS on this compose network; the EN logs a warning (SPEC §15.6)
      EN_NATS_USERNAME: site
      EN_NATS_PASSWORD: ${SITE_NATS_PASSWORD:?set SITE_NATS_PASSWORD in .env}
      EN_OTEL_HTTP_ENDPOINT: ${EN_OTEL_HTTP_ENDPOINT:?set EN_OTEL_HTTP_ENDPOINT in .env}
    volumes:
      - /var/lib/ieo/en:/var/lib/ieo/en
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge-net

networks:
  edge-net:
    driver: bridge

volumes:
  pgdata1:
  lo-data:
