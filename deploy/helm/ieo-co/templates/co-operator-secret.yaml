# The operator API's bearer token (SPEC §6.3, §15.6): at least 32 bytes, or the CO exits with code 2.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-co-operator
type: Opaque
stringData:
  CO_OPERATOR_TOKEN: {{ required "set co.operatorToken (at least 32 bytes)" .Values.co.operatorToken | quote }}
