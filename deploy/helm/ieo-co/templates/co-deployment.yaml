apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-co
spec:
  replicas: {{ .Values.co.replicas }}
  selector:
    matchLabels:
      app: co
  template:
    metadata:
      labels:
        app: co
    spec:
      containers:
        - name: co
          image: {{ .Values.co.image }}
          env:
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Release.Name }}-postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.db }}?sslmode=disable
            - name: CO_MARGO_ADDR
              value: ":{{ .Values.co.margoPort }}"
            - name: CO_OPERATOR_ADDR
              value: ":{{ .Values.co.operatorPort }}"
            # SPEC §6.3, §15.6: the operator API's bearer token, from a Secret, never a plain value.
            - name: CO_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-co-operator
                  key: CO_OPERATOR_TOKEN
          ports:
            - name: margo
              containerPort: {{ .Values.co.margoPort }}
            - name: operator
              containerPort: {{ .Values.co.operatorPort }}
