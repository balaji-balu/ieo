postgres:
  image: postgres:15
  user: postgres
  password: postgres
  db: orchestration
  port: 5432
  storage: 5Gi

nats:
  image: nats:2.10
  port: 4222

co:
  image: ghcr.io/balaji-balu/ieo-co:latest
  replicas: 1
  margoPort: 9002 # the Margo API, which LOs poll
  operatorPort: 8443 # the operator API, for edgectl (SPEC §11.3)
  # The operator API's bearer token, at least 32 bytes (SPEC §6.3). Required: pass it with
  # --set-file co.operatorToken=<file> or a values file kept out of version control.
  operatorToken: ""

